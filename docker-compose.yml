# Local development stack: `make dev-up`.
services:
  db:
    # The official PostGIS image is amd64-only; production (t3.small) is amd64 too.
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truckroute}
      POSTGRES_USER: ${POSTGRES_USER:-truckroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truckroute}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py seed_towns &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      ALLOWED_HOSTS: "*"
      TOM_TOM_API_KEY: ${TOM_TOM_API_KEY:-}
      # `fixtures` replays recorded data for the four sample trips (no API key needed).
      PROVIDERS_MODE: ${PROVIDERS_MODE:-live}
      DATABASE_URL: postgres://${POSTGRES_USER:-truckroute}:${POSTGRES_PASSWORD:-truckroute}@db:5432/${POSTGRES_DB:-truckroute}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    # The node_modules volume outlives the image, so install on every start (a no-op when
    # nothing changed); otherwise a new dependency breaks `make dev-up` until the volume is reset.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      # Same-origin /api in dev, like CloudFront in production.
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # So `make dev-up --wait` returns only once the app is really being served.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "5173:5173"

volumes:
  db_data:
  frontend_node_modules:
