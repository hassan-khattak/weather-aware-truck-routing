[project]
name = "truckroute-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "gunicorn>=22",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "httpx>=0.28.1",
    "timezonefinder>=9.2.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-env>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-pyyaml>=6.0.12.20261122",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.17",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
env = ["DEBUG=True"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "config", "providers", "places"]
