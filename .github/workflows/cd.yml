name: CD

# Deploys to AWS after a MANUAL approval (required reviewer on the `production` environment).
# AWS access uses OIDC: the deploy role trusts only jobs running in that environment, so the
# image build/push also happens after approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image (tagged by commit)
        run: |
          image="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "$image" backend
          docker push "$image"
          echo "BACKEND_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy backend over SSM
        run: |
          b64() { base64 < "$1" | tr -d '\n'; }
          jq -n \
            --arg compose "$(b64 docker-compose.prod.yml)" \
            --arg caddy "$(b64 Caddyfile)" \
            --arg script "$(b64 deploy/remote-deploy.sh)" \
            --arg run "BACKEND_IMAGE=${BACKEND_IMAGE} GIT_SHA=${GITHUB_SHA} AWS_REGION=${AWS_REGION} bash /opt/truckroute/remote-deploy.sh" \
            '{commands: [
              "set -euo pipefail",
              "mkdir -p /opt/truckroute",
              "echo \($compose) | base64 -d > /opt/truckroute/docker-compose.prod.yml",
              "echo \($caddy) | base64 -d > /opt/truckroute/Caddyfile",
              "echo \($script) | base64 -d > /opt/truckroute/remote-deploy.sh",
              $run
            ]}' > ssm-params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$status" = "Success" ]

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and publish frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # Hashed assets are immutable; index.html must always be revalidated.
          aws s3 sync dist "s3://${WEB_BUCKET}" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          # The map worker is a module script: it must be served with a JavaScript MIME type.
          aws s3 cp dist/assets "s3://${WEB_BUCKET}/assets" --recursive --exclude "*" --include "*.mjs" \
            --content-type "text/javascript" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${WEB_BUCKET}/index.html" \
            --cache-control "no-cache" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            version=$(curl -fsS "${APP_URL}/api/v1/health" | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "deployed ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "smoke test failed: expected ${GITHUB_SHA}, got ${version:-<none>}" >&2
          exit 1
